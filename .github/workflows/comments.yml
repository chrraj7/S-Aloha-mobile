# Removes from texts published by the maintainer's account a footer added automatically by
# a tool (pattern in the PIED_A_RETIRER secret, never printed): an issue or pull request
# comment is posted again, clean (without the history of the old text); a pull request
# description, a review or a line comment is edited. Same workflow as the parent S-Aloha
# repository. scripts/remove-footer.py only reads the event text and runs nothing from the
# repository's pull requests.
name: Comments

on:
  # Safe trigger here: the job only runs for the owner and only runs the script of the
  # default branch, never the code of a pull request.
  issue_comment:  # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  footer:
    name: Footer
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/remove-footer.py
          sparse-checkout-cone-mode: false
      - name: Removal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIED: ${{ secrets.PIED_A_RETIRER }}
        run: |
          # Script read from the default branch: missing until this workflow is merged there.
          if [ ! -f scripts/remove-footer.py ]; then echo "Script missing from the default branch: nothing to do."; exit 0; fi
          python3 scripts/remove-footer.py
