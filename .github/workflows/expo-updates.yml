# Weekly freshness check of the Expo packages: `expo install --check` online compares them
# with the latest patch versions published for the SDK. A red run means an update is due:
# `npx expo install --fix` in a pull request. Pull requests run the same check offline
# (ci.yml), so a new Expo release never blocks them. Actions pinned by SHA; read-only token.
name: Expo updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Expo packages up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doctor
