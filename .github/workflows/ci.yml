# Checks for every push to main and every pull request: TypeScript types, dependency
# alignment with the Expo SDK, and a web export that proves the app bundles.
# Actions are pinned by SHA, as in the parent S-Aloha repository; read-only token.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request keeps only its latest run; on main, each commit keeps its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type-check, dependencies and build
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
